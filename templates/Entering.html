<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Auto Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/EnteringStyle.css">
<script src="/static/EnteringScript.js"></script> <!-- У тебя там был <link> для JS, нужно использовать <script> -->


</head>



<body>




<!-- FONS, DELAT FOTO DLA FONA -->
<div class="bg-wrap">
  <div class="bg-inner"></div>
</div>

<!-- Navigacionnaya panel -->
<nav>
  <a class="logo" href="#">
    <div class="logo-text">
      <span>Quick</span><span>Auto</span>
    </div>
  </a>

  <ul class="nav-links">
    <li><a href="TitlesOfCreat.html">About</a></li>
  </ul>


</nav>

<!-- Tuda kuda vvodit dannye -->
<main class="page">
  <div class="auth-card">

    <div class="auth-header">
      <h1>Welcome to <em>Quick Auto</em></h1>
      <p>Sign in to your account or create a new one</p>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('signin')">Sign In</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <!--SIGN IN-->
    <div class="form-panel active" id="signin">
      <form action="/login" method="POST">
    
      <div class="form-group">
        <label>Email address</label>
          <div class="input-wrap">
            <input type="email" name="email" placeholder="you@email.com" autocomplete="email" required />
        <!-- тут твоя svg-иконка -->
          </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <!-- ДОБАВЛЕН name="password" и required -->
        <input type="password" name="password" id="pw-signin" placeholder="••••••••" autocomplete="current-password" required />
        <!-- тут твоя svg-иконка и кнопка глазика -->
      </div>
    </div>

    <!-- ... чекбокс и кнопка ... -->
    <button class="btn-submit" type="submit">Sign In</button>
  </form>
</div>






    <!-- REGISTRACIA -->

    <!-- Указываем путь /register и метод POST -->
    <div class="form-panel" id="register">
      <form action="/register" method="POST">
    
    <!-- Добавляем name="first_name" и name="last_name" -->
        <input type="text" name="first_name" placeholder="John" autocomplete="given-name" required />
        <input type="text" name="last_name" placeholder="Doe" autocomplete="family-name" required />
    
    <!-- Добавляем name="email" -->
        <input type="email" name="email" placeholder="you@email.com" autocomplete="email" required />
    
    <!-- Добавляем name="phone" -->
        <input type="tel" name="phone" placeholder="+7 777 777 7777" autocomplete="tel" required />
    
    <!-- Добавляем name="password" -->
        <input type="password" name="password" id="pw-register" placeholder="Create a strong password" autocomplete="new-password" required />

    <!-- ... чекбокс ... -->
        <button class="btn-submit" type="submit">Create Account</button>
      </form>
    </div>

    <div class="auth-footer">
      <span id="footer-text">Don't have an account? <a href="#" class="link-green" onclick="switchTab('register');return false;">Sign up free</a></span>
    </div>
  </div>

  
</main>


</body>
</html>
